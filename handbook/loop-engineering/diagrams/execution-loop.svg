<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" font-family="'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.n{font-size:14px;font-weight:500;fill:#0C447C}
.ns{font-size:11px;fill:#185FA5}
.pn{font-size:14px;font-weight:500;fill:#3C3489}
.ps{font-size:11px;fill:#534AB7}
.dn{font-size:14px;font-weight:500;fill:#854F0B}
.rn{font-size:14px;font-weight:500;fill:#791F1F}
.gn{font-size:14px;font-weight:500;fill:#3B6D11}
.ct{font-size:14px;font-weight:500;fill:#0C447C}
.cs{font-size:11px;fill:#185FA5}
.lb{font-size:12px;fill:#A32D2D}
.ln{font-size:11px;fill:#888780}
</style>

<rect x="40" y="70" width="1140" height="140" rx="14" fill="#FAFCFE" stroke="#B5D4F4" stroke-width=".6"/>
<rect x="60" y="110" width="110" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width=".6"/>
<text class="ct" x="115" y="132" text-anchor="middle">① 计划回路</text>
<text class="cs" x="115" y="150" text-anchor="middle">人放行</text>
<rect x="200" y="110" width="170" height="52" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width=".6"/>
<text class="n" x="285" y="141" text-anchor="middle">读契约 + 提案</text>
<rect x="400" y="110" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width=".6"/>
<text class="n" x="495" y="141" text-anchor="middle">拆小任务 · 绑定完成条件</text>
<rect x="620" y="110" width="140" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width=".6"/>
<text class="dn" x="690" y="141" text-anchor="middle">人确认？</text>
<rect x="790" y="110" width="120" height="52" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width=".6"/>
<text class="gn" x="850" y="141" text-anchor="middle">放行</text>
<g fill="none" stroke="#185FA5" stroke-width="1.6">
<path d="M370 136H400" marker-end="url(#ar)"/>
<path d="M590 136H620" marker-end="url(#ar)"/>
<path d="M760 136H790" marker-end="url(#ar)"/>
<path d="M690 110V88H495V110" marker-end="url(#ar)"/>
</g>
<text class="lb" x="592" y="84" text-anchor="middle">否：重做计划</text>
<text class="ln" x="200" y="196">重做计划仍定不下来 → 回到上游补契约或需求</text>

<rect x="40" y="240" width="1140" height="140" rx="14" fill="#FCFBFE" stroke="#CECBF6" stroke-width=".6"/>
<rect x="60" y="280" width="110" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width=".6"/>
<text class="pn" x="115" y="302" text-anchor="middle">② TDD 回路</text>
<text class="ps" x="115" y="320" text-anchor="middle">AI 执行</text>
<rect x="200" y="280" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width=".6"/>
<text class="n" x="295" y="311" text-anchor="middle">从契约场景定「做完」</text>
<rect x="420" y="280" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width=".6"/>
<text class="n" x="485" y="311" text-anchor="middle">让 AI 写</text>
<rect x="580" y="280" width="150" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width=".6"/>
<text class="dn" x="655" y="311" text-anchor="middle">测试结果？</text>
<rect x="770" y="280" width="150" height="52" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width=".6"/>
<text class="gn" x="845" y="311" text-anchor="middle">本任务完成</text>
<rect x="970" y="280" width="210" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".6"/>
<text class="rn" x="1075" y="311" text-anchor="middle">止损线：2–3 轮仍红？</text>
<g fill="none" stroke="#534AB7" stroke-width="1.6">
<path d="M390 306H420" marker-end="url(#ar)"/>
<path d="M550 306H580" marker-end="url(#ar)"/>
<path d="M655 280V258H485V280" marker-end="url(#ar)"/>
</g>
<path d="M730 306H770" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="750" y="296" text-anchor="middle" font-size="12" fill="#3B6D11">绿</text>
<path d="M710 280V258H1075V280" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="lb" x="570" y="254" text-anchor="middle">红：读报错 → 改</text>
<text class="lb" x="892" y="252" text-anchor="middle">累计 2–3 轮仍红 → 停手</text>

<rect x="40" y="440" width="1140" height="210" rx="14" fill="#FEFBFA" stroke="#F7C1C1" stroke-width=".6"/>
<rect x="60" y="480" width="110" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".6"/>
<text class="rn" x="115" y="502" text-anchor="middle">③ 防跑偏</text>
<text x="115" y="520" text-anchor="middle" font-size="11" fill="#A32D2D">人触发</text>
<rect x="200" y="480" width="170" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width=".6"/>
<text class="dn" x="285" y="511" text-anchor="middle">改动超出计划？</text>
<rect x="410" y="480" width="110" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".6"/>
<text class="rn" x="465" y="511" text-anchor="middle">停手</text>
<rect x="560" y="480" width="170" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".6"/>
<text class="rn" x="645" y="511" text-anchor="middle">回退超范围代码</text>
<rect x="770" y="480" width="260" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".6"/>
<text class="rn" x="900" y="511" text-anchor="middle">偏差写回提案 · 必要时补设计</text>
<rect x="200" y="575" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#BA7517" stroke-width=".6"/>
<text class="dn" x="275" y="606" text-anchor="middle">还有任务？</text>
<g fill="none" stroke="#A32D2D" stroke-width="1.6">
<path d="M370 506H410" marker-end="url(#ar)"/>
<path d="M520 506H560" marker-end="url(#ar)"/>
<path d="M730 506H770" marker-end="url(#ar)"/>
<path d="M285 532V575" marker-end="url(#ar)"/>
</g>
<text class="lb" x="297" y="556" text-anchor="start">否</text>
<text x="383" y="496" text-anchor="middle" font-size="12" fill="#A32D2D">是</text>

<path d="M200 601H185V306H200" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="176" y="452" text-anchor="end" font-size="12" fill="#3B6D11">是：回 TDD</text>
<path d="M1075 332V424H405V162" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="lb" x="740" y="416" text-anchor="middle">回 ① 重新拆任务</text>
<path d="M1180 306H1210V460H645V480" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="lb" x="940" y="452" text-anchor="middle">回 ③ 回退代码</text>
<path d="M850 162V222H295V280" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M845 332V400H285V480" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="565" y="392" text-anchor="middle" font-size="12" fill="#5F5E5A">每个任务后检查</text>
<path d="M900 480V472H565V162" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="lb" x="730" y="464" text-anchor="middle">改完提案 → 回 ① 重拆</text>

<path d="M275 627V660" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="287" y="646" text-anchor="start" font-size="12" fill="#185FA5">否</text>
<rect x="200" y="660" width="200" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width=".6"/>
<text class="n" x="300" y="682" text-anchor="middle">第五步 质量门</text>
<text class="ns" x="300" y="700" text-anchor="middle">判断整个系统能不能上线</text>
</svg>
