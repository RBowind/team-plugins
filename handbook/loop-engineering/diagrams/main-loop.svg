<g class="rr" text-anchor="middle">
<text x="306" y="260">需求模糊</text>
<text x="447" y="260">牵动架构</text>
<text x="612" y="260">超范围→写回提案</text>
<text x="813" y="260">测试不过</text>
<text x="406" y="218">扩需求边界</text>
<text x="595" y="218">止损：规则漏了</text>
<text x="708" y="176">契约漂移</text>
<text x="861" y="176">驳回/发布异常</text>
<text x="660" y="92">驳回属新需求</text>
<text x="925" y="134">坑不构成新需求</text>
</g>

<rect x="740" y="520" width="220" height="64" rx="12" fill="#EAF3DE" stroke="#639922" stroke-width=".6"/>
<text x="850" y="546" text-anchor="middle" font-size="14" font-weight="500" fill="#3B6D11">本轮交付完成</text>
<text x="850" y="566" text-anchor="middle" font-size="11" fill="#639922">仓库与知识库留在原地</text>

<rect x="1050" y="520" width="280" height="64" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width=".6"/>
<text class="ff" x="1190" y="546" text-anchor="middle">Flywheel：进下一轮迭代？</text>
<text x="1190" y="566" text-anchor="middle" font-size="11" fill="#BA7517">复盘判定的是"要不要起下一轮"</text>

<path d="M1356 358H1396V552H1336" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1385" y="348" text-anchor="middle" font-size="12" fill="#BA7517">进下一轮</text>
<path d="M1050 552H966" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1008" y="542" text-anchor="middle" font-size="12" fill="#639922">否</text>
<path d="M1190 584V720Q1190 740 1170 740H80Q60 740 60 720V378Q60 358 80 358H133" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="764" text-anchor="middle" font-size="12" fill="#BA7517">是：作为下一轮的输入</text>

<g class="lg">
<path d="M200 620H244" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="256" y="624">实线：线性推进（主链路）</text>
<path d="M200 648H244" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="256" y="652">粗箭头：跨步骤回退，本层修不了就退到上一层</text>
<path d="M200 676H244" fill="none" stroke="#888780" stroke-width=".6" stroke-dasharray="3 3"/>
<text x="256" y="680">细虚线：本步的内闭环，原地修</text>
<path d="M200 704H244" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#ar)"/>
<text x="256" y="708">橙色外环：第七步判定后进入下一轮，不算回退</text>
</g>
