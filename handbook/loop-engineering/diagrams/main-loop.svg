<rect x="855" y="420" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width=".6"/>
<text class="pp" x="925" y="441" text-anchor="middle">review→修→再审</text>
<rect x="1032" y="420" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width=".6"/>
<text class="pp" x="1102" y="441" text-anchor="middle">预检→冒烟→观察</text>
<rect x="1209" y="420" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width=".6"/>
<text class="pp" x="1279" y="441" text-anchor="middle">起草→补数据→定稿</text>
